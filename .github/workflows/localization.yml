# 验证最终审计前汉化规则库 08ee73d：回放、对比、遗漏英文扫描。
name: 中文汉化验证

on:
  push:
    paths:
      - '**/*.py'
      - '中文汉化插件/**'
      - 'frontend/src/**'
      - 'packaging/installer/**'
      - '.github/workflows/localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 读取官方基线
        shell: bash
        run: |
          BASE=$(python -c "import json; print(json.load(open('中文汉化插件/内部/汉化规则.json', encoding='utf-8'))['upstream']['baseline_commit'])")
          mkdir -p .localization-upstream
          git archive "$BASE" | tar -x -C .localization-upstream
          echo "baseline=$BASE"

      - name: 从官方源码重放中文汉化
        run: |
          python "中文汉化插件/一键汉化.py" --root .localization-upstream --strict --report-dir "中文汉化插件/内部/报告/CI"

      - name: 验证重放结果
        run: |
          python "中文汉化插件/内部/验证汉化完整性.py" \
            --localized-root .localization-upstream \
            --reference-root . \
            --catalog "中文汉化插件/内部/汉化规则.json"

      # 验证最新深层汉化批次：只检查本地化一致性，不修改业务源码。
      # 验证修复后的插入规则：持续检查本地化一致性，不修改业务源码。
      - name: 扫描遗漏英文
        run: |
          python "中文汉化插件/内部/扫描遗漏英文.py" \
            --root . \
            --report "中文汉化插件/内部/报告/CI/遗漏英文.json"

      - name: 上传汉化验证报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 中文汉化验证报告
          path: 中文汉化插件/内部/报告/CI/
          retention-days: 14
