name: 一次性重建汉化规则库

on:
  push:
    paths:
      - '.github/workflows/rebuild-localization-catalog.yml'
  workflow_dispatch:

  # 深度汉化阶段：语法修复后重建规则，确保 strict 回放一致。
# 本次同步：吸收最终语法修复及剩余运行期显示汉化，仅重建汉化规则库与翻译记忆。
permissions:
  # 中文源码发生变化后，由此工作流统一同步规则库、翻译记忆以及安装器汉化。
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 重建规则库与翻译记忆
        run: |
          python "中文汉化插件/内部/重建汉化规则库.py" \
            --upstream-ref 0902c74400f6f77e2e7fb14ab02e8fa8187d2f83

      # 只提交自动生成的规则库与翻译记忆，避免碰触业务源码；同步最新深层汉化；继续同步纯汉化文本。
      # 只提交自动生成的规则库与翻译记忆；修复插入规则后重新同步。
      - name: 提交重建结果
        shell: bash
        run: |
          if git diff --quiet -- "中文汉化插件/内部/汉化规则.json" "中文汉化插件/内部/翻译记忆库.json"; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "中文汉化插件/内部/汉化规则.json" "中文汉化插件/内部/翻译记忆库.json"
          git commit -m "i18n: 自动重建完整汉化规则库"
          git push
